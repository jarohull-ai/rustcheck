[package]
name = "rustcheck"
version = "0.1.0"
edition = "2021"
description = "Sandboxed Rust compile verification for LLM-generated code: structured diagnostics, hard timeouts, bwrap isolation."
license = "MIT"
repository = "https://github.com/jarohull-ai/rustcheck"
keywords = ["rust", "verifier", "sandbox", "llm", "compile"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

[lib]
name = "rustcheck"
path = "src/lib.rs"

[[bin]]
name = "rustcheck"
path = "src/main.rs"
